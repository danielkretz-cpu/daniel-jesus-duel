name: Godot Web CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check build tools
        run: bash scripts/install-build-tools.sh
      - name: Restore verified Godot downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/godot-4.6.3/Godot_v4.6.3-stable_linux.x86_64.zip
            tooling/4.6.3.stable/
          key: ${{ runner.os }}-godot-4.6.3-${{ hashFiles('scripts/install-godot.sh', 'tooling/template-provenance.json') }}
      - name: Import, test, and export with pinned Godot
        run: bash scripts/build-web.sh
      - name: Upload the checked Pages export
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web/
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified export to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
